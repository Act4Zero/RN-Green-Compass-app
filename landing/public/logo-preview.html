<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Green Compass logo preview</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f4f6ef;
        --ink: #14251c;
        --muted: #5c6d62;
        --forest: #153f2d;
        --line: rgba(21, 63, 45, 0.14);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 82% 16%, rgba(185, 228, 104, 0.22), transparent 28%), var(--paper);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: rgba(244, 246, 239, 0.9);
        backdrop-filter: blur(18px);
      }

      .header-inner {
        width: min(calc(100% - 40px), 1240px);
        min-height: 88px;
        margin-inline: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        font-weight: 850;
        letter-spacing: -0.025em;
      }

      .brand img {
        width: 52px;
        height: 52px;
        object-fit: contain;
        border-radius: 15px;
      }

      nav { display: flex; gap: 26px; color: var(--muted); font-size: 14px; }

      main {
        width: min(calc(100% - 40px), 1240px);
        margin: 0 auto;
        padding: 96px 0;
      }

      h1 { max-width: 760px; margin: 0; font-size: clamp(46px, 7vw, 88px); line-height: 0.98; letter-spacing: -0.055em; }
      h1 span { color: var(--forest); }
      p { max-width: 620px; margin: 28px 0 0; color: var(--muted); font-size: 19px; line-height: 1.65; }

      @media (max-width: 700px) {
        nav { display: none; }
        main { padding-top: 70px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="brand">
          <img id="preview-logo" src="/images/GCLogo-rich-premium-web.png" alt="Green Compass logo">
          <span>Green Compass</span>
        </div>
        <nav aria-label="Preview navigation">
          <span>Features</span>
          <span>How it works</span>
          <span>Research</span>
          <span>Contact</span>
        </nav>
      </div>
    </header>
    <main>
      <h1>Every choice can point toward a <span>greener future.</span></h1>
      <p>A focused preview of the new premium logo in the real landing-page header size.</p>
    </main>
    <script>
      const logo = new URLSearchParams(window.location.search).get('logo');
      if (logo === 'gold') {
        document.getElementById('preview-logo').src = '/images/GCLogo-gold-premium-lighter-web.png';
      }
    </script>
  </body>
</html>
